name: CI
on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            node-version: [22, 24]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node-version }}
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name : Run Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Show Build Output
              run: ls -la dist
            - name: upload build output
              if: matrix.node-version == '24'
              uses: actions/upload-artifact@v4
              with:
                name: dist
                path: dist
                retention-days: 5

